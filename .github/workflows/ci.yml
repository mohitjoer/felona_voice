name: CI — Test & Verify

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        os: [ubuntu-latest]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🔨 Compile TypeScript (Workspaces)
        id: build
        run: npm run build

      - name: 🔍 Typecheck
        id: typecheck
        run: npm run typecheck

      - name: 🧹 Lint
        id: lint
        run: npm run lint

      - name: 🧪 Run Vitest Test Suite
        id: test
        # pipefail is required: without it `tee` becomes the step's exit
        # status and a failing suite would be reported as passing.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: 🧷 Run Agent Regression Scenarios
        id: scenarios
        run: node packages/cli/dist/index.js test ./examples/scenarios.ts

      - name: 🗺️ Verify CLI Graph Visualization
        id: visualize
        run: |
          node packages/cli/dist/index.js visualize ./examples/voice-graph-flow/index.ts --md --out pr-verification-graph.md
          cat pr-verification-graph.md
          rm pr-verification-graph.md

      # Status is derived from the actual step outcomes and the real test count
      # parsed out of the run output. Hardcoded "✅ 62/62" claims stayed green
      # even when the build or the suite failed.
      - name: 📋 Publish PR CI Summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          SCENARIOS_OUTCOME: ${{ steps.scenarios.outcome }}
          VISUALIZE_OUTCOME: ${{ steps.visualize.outcome }}
        run: |
          status() {
            if [ "$1" = "success" ]; then echo "✅ Passed"; else echo "❌ Failed ($1)"; fi
          }

          TEST_COUNT="not reported"
          if [ -f test-output.log ]; then
            TEST_COUNT=$(grep -oE 'Tests +[0-9]+ passed' test-output.log | tail -1 | grep -oE '[0-9]+' || true)
            TEST_COUNT="${TEST_COUNT:-not reported}"
          fi

          {
            echo "### 🎙️ Felona Voice CI Results"
            echo ""
            echo "| Check | Status |"
            echo "| :--- | :--- |"
            echo "| **Node Version** | \`${{ matrix.node-version }}\` |"
            echo "| **OS Runner** | \`${{ matrix.os }}\` |"
            echo "| **TypeScript Build** | $(status "$BUILD_OUTCOME") |"
            echo "| **Typecheck** | $(status "$TYPECHECK_OUTCOME") |"
            echo "| **Lint** | $(status "$LINT_OUTCOME") |"
            echo "| **Vitest Test Suite** | $(status "$TEST_OUTCOME") — $TEST_COUNT passed |"
            echo "| **Agent Scenarios** | $(status "$SCENARIOS_OUTCOME") |"
            echo "| **CLI Visualizer** | $(status "$VISUALIZE_OUTCOME") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-node-${{ matrix.node-version }}
          path: test-output.log
          if-no-files-found: ignore
